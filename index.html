<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Land Use and Land Cover Analysis</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f9ff; /* Light sky blue */
            color: #333;
        }
        h2 {
            background-color: #0983F6; /* Sky blue */
            color: white;
            padding: 15px 10px;
            text-align: center;
            margin: 0;
            font-size: 26px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .window {
            display: none;
            padding: 20px;
            max-width: 1200px;
            margin: auto;
            overflow-x: hidden;
        }
        .active {
            display: block;
        }
        #map {
            height: 600px;
            width: 100%;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

	#loading-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: #f4f9ff; /* Light blue matching your theme */
    z-index: 1000;
    display: none; /* Initially hidden */
    justify-content: center;
    align-items: center;
}

#loading-overlay .loading-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 300px;
    height: 250px;
    padding: 30px;
    text-align: center;
    background: white; /* White box for better contrast */
    border: 2px solid #0983F6; /* Vibrant blue border */
    border-radius: 12px; /* Rounded corners */
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1); /* Subtle shadow */
}

#loading-overlay .spinner {
    width: 80px;
    height: 80px;
    border: 8px solid rgba(0, 0, 255, 0.2); /* Light transparent blue */
    border-top: 8px solid #0983F6; /* Vibrant blue spinner */
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin-bottom: 20px;
}

@keyframes spin {
    from {
        transform: rotate(0deg);
    }
    to {
        transform: rotate(360deg);
    }
}

#loading-overlay .loading-container p {
    font-size: 18px;
    font-weight: bold;
    text-transform: uppercase;
    color: #0983F6; /* Matches the blue theme */
    margin-top: 10px;
}

        .results-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 30px;
        }
        .results-container .image-container {
            text-align: center;
            background: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .results-container .image-container h4 {
            margin-bottom: 10px;
            color: #0983F6;
        }
        .results-container img {
            max-width: 100%;
            max-height: 300px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .legend-container {
            margin: 20px auto;
            padding: 15px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        .legend-items {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            flex-wrap: wrap;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .legend-color {
            width: 20px;
            height: 20px;
            border: 1px solid #000;
            border-radius: 4px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        table th, table td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
        }
        table th {
            background: #0983F6;
            color: white;
        }
        button {
            border: none;
            padding: 10px 20px;
            margin: 10px 5px;
            cursor: pointer;
            border-radius: 5px;
            font-size: 16px;
            transition: background 0.3s ease;
        }
        .btn-primary {
            background: #0983F6;
            color: white;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
        }
        .btn-primary:hover {
            background: #006bb7;
        }
        .btn-secondary {
            background: #4CAF50;
            color: white;
        }
        .btn-secondary:hover {
            background: #3e8e41;
        }
        .btn-orange {
            background: #FFA500;
            color: white;
        }
        .btn-orange:hover {
            background: #e59400;
        }
        canvas {
            margin: auto;
            max-width: 400px; /* Original size for the pie chart */
            display: block;
        }
    </style>
</head>
<body>
    <h2>Land Use and Land Cover Analysis</h2>

    <!-- Cropping Window -->
    <div id="cropping-window" class="window active">
        <p><strong>Use the rectangle tool to select an area on the map.</strong></p>
        <div id="map"></div>
        <button id="recenter-map" class="btn-secondary">Recenter Map</button>
        <button id="go-to-prediction" class="btn-primary">Go to Prediction</button>
    </div>

    <!-- Prediction Window -->
    <div id="prediction-window" class="window">
       <div id="loading-overlay">
    	<div class="loading-container">
        	<div class="spinner"></div>
        <p>Processing Prediction... Please wait</p>
    </div>
</div>


        <div class="results-container">
            <div class="image-container">
                <h4>User Selected Area</h4>
                <img id="cropped-image" alt="Cropped Image" />
            </div>
            <div class="image-container">
                <h4>Corresponding Segmentation Mask</h4>
                <img id="segmentation-mask" alt="Segmentation Mask" />
            </div>
        </div>
        <div class="legend-container">
            <h4>Legend</h4>
            <div class="legend-items">
                <div class="legend-item">
                    <div class="legend-color" style="background: rgb(255, 162, 0);"></div>
                    <span>Bareland</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: rgb(255, 13, 0);"></div>
                    <span>Building</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: rgb(160, 32, 240);"></div>
                    <span>Road</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: rgb(18, 107, 0);"></div>
                    <span>Vegetation</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: rgb(0, 110, 255);"></div>
                    <span>Water</span>
                </div>
            </div>
        </div>
        <div>
            <table id="area-table"></table>
        <button id="download-images" class="btn-secondary">Download Results in ZIP</button>
        </div>
        <canvas id="pie-chart"></canvas>
        <button id="back-to-cropping" class="btn-orange">Back to Area Selection</button>
    </div>

    <script>
      let mapCenter = [27.6409129, 85.3392277];
let map = L.map('map').setView(mapCenter, 15);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

let imageUrl = 'http://127.0.0.1:8000/static/downsampled.png';
let imageBounds = [[27.6336405, 85.3330463], [27.6481854, 85.3454091]];
L.imageOverlay(imageUrl, imageBounds).addTo(map);

let drawnItems = new L.FeatureGroup();
map.addLayer(drawnItems);
let drawControl = new L.Control.Draw({
    draw: {
        rectangle: true,
        polygon: false,
        circle: false,
        marker: false,
        polyline: false,
    },
    edit: {
        featureGroup: drawnItems,
        remove: true,
    },
});

map.addControl(drawControl);

let selectedBounds;
map.on(L.Draw.Event.CREATED, function (e) {
    drawnItems.clearLayers();
    selectedBounds = e.layer.getBounds();
    drawnItems.addLayer(e.layer);
});

document.getElementById('recenter-map').addEventListener('click', () => {
    map.setView(mapCenter, 15);
});

document.getElementById('go-to-prediction').addEventListener('click', () => {
    if (!selectedBounds) {
        alert('Please select an area first.');
        return;
    }
    // Show the loading overlay
    document.getElementById('loading-overlay').style.display = 'flex';

    // Hide the cropping window and show the prediction window
    document.getElementById('cropping-window').classList.remove('active');
    document.getElementById('prediction-window').classList.add('active');

    // Start prediction process
    handlePrediction();
});

async function handlePrediction() {
    try {
        let response = await fetch('http://127.0.0.1:8000/crop_and_predict', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                topLeft: [selectedBounds.getNorthWest().lat, selectedBounds.getNorthWest().lng],
                bottomRight: [selectedBounds.getSouthEast().lat, selectedBounds.getSouthEast().lng]
            })
        });
        let data = await response.json();

        // Display prediction results
        document.getElementById('cropped-image').src = `data:image/jpeg;base64,${data.original_image}`;
        document.getElementById('segmentation-mask').src = `data:image/png;base64,${data.segmentation_map}`;
        let tableHTML = "<tr><th>Category</th><th>Pixels</th><th>Area (sq. km)</th><th>Proportion (%)</th></tr>";
        for (let [category, stats] of Object.entries(data.area_statistics)) {
            tableHTML += `<tr>
                <td>${category}</td>
                <td>${stats.pixels}</td>
                <td>${stats.area_km2.toFixed(4)}</td>
                <td>${(stats.proportion * 100).toFixed(2)}</td>
            </tr>`;
        }
        document.getElementById('area-table').innerHTML = tableHTML;

        let chartColors = ['rgb(255, 162, 0)', 'rgb(255, 13, 0)', 'rgb(160, 32, 240)', 'rgb(18, 107, 0)', 'rgb(0, 110, 255)'];
        new Chart(document.getElementById('pie-chart'), {
            type: 'pie',
            data: {
                labels: Object.keys(data.area_statistics),
                datasets: [{
                    data: Object.values(data.area_statistics).map(stat => stat.proportion * 100),
                    backgroundColor: chartColors,
                    borderColor: '#fff',
                    borderWidth: 2,
                }],
            },
            options: {
                plugins: {
                    title: {
                        display: true,
                        text: 'Land Cover Proportion (%)'
                    }
                }
            }
        });
    } catch (error) {
        alert('Error processing segmentation. Please try again.');
    } finally {
        // Hide the loading overlay
        document.getElementById('loading-overlay').style.display = 'none';
    }
}

function resetResults() {
    selectedBounds = null;
    drawnItems.clearLayers();
    document.getElementById('cropped-image').src = '';
    document.getElementById('segmentation-mask').src = '';
    document.getElementById('area-table').innerHTML = '';
    Chart.helpers.each(Chart.instances, function (instance) {
        instance.destroy();
    });
}

        document.getElementById('download-images').addEventListener('click', () => {
            window.location.href = 'http://127.0.0.1:8000/download_zip';
        });

document.getElementById('back-to-cropping').addEventListener('click', () => {
    resetResults();
    document.getElementById('prediction-window').classList.remove('active');
    document.getElementById('cropping-window').classList.add('active');
});

    </script>
</body>
</html>
